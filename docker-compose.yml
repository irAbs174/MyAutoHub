services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myautohub}
      POSTGRES_USER: ${POSTGRES_USER:-myautohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myautohub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myautohub} -d ${POSTGRES_DB:-myautohub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-myautohub}:${POSTGRES_PASSWORD:-myautohub}@db:5432/${POSTGRES_DB:-myautohub}
      POSTGRES_HOST: db
      # settings package picks local vs production from DJANGO_ENV in .env
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:

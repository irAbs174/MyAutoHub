{% load i18n %}
<section class="page-intro reveal">
  <div class="page-intro-glow" aria-hidden="true"></div>
  <div class="page-intro-inner">
    {% if kicker %}<p class="sections-label">{{ kicker }}</p>{% endif %}
    <h1>{{ title }}</h1>
    {% if lead %}<p class="page-intro-lead">{{ lead }}</p>{% endif %}
    {% if cta_url or cta2_url %}
      <div class="actions">
        {% if cta_url %}
          <a class="btn" href="{{ cta_url }}">{{ cta_label }}</a>
        {% endif %}
        {% if cta2_url %}
          <a class="btn btn-ghost" href="{{ cta2_url }}">{{ cta2_label }}</a>
        {% endif %}
      </div>
    {% endif %}
  </div>
</section>

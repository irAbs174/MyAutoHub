name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Django checks & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_ENV: local
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "true"
          DJANGO_ALLOWED_HOSTS: localhost,testserver
          USE_SQLITE: "true"
        run: python manage.py check

      - name: Run tests
        env:
          DJANGO_ENV: local
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "true"
          DJANGO_ALLOWED_HOSTS: localhost,testserver
          USE_SQLITE: "true"
        run: python manage.py test --verbosity=1

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack release
        run: |
          ARCHIVE="${RUNNER_TEMP}/myautohub-release.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.deploy' \
            --exclude='.env' \
            --exclude='db.sqlite3' \
            --exclude='uploads' \
            --exclude='media' \
            --exclude='staticfiles' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .
          cp "$ARCHIVE" "${GITHUB_WORKSPACE}/myautohub-release.tar.gz"
          ls -lh myautohub-release.tar.gz

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: myautohub-release.tar.gz
          target: /tmp
          overwrite: true

      - name: Unpack and rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export APP_DIR=/var/www/myautohub/application
            export RELEASE_ARCHIVE=/tmp/myautohub-release.tar.gz
            export DEPLOY_SHA=${{ github.sha }}

            # Extract first so we always execute this release's deploy.sh
            # (not the previous on-disk copy that CI would otherwise invoke).
            if [[ ! -f "${APP_DIR}/.env" ]]; then
              echo "ERROR: missing production .env at ${APP_DIR}/.env" >&2
              exit 1
            fi
            if [[ ! -f "${RELEASE_ARCHIVE}" ]]; then
              echo "ERROR: release archive not found: ${RELEASE_ARCHIVE}" >&2
              exit 1
            fi
            TMP_ENV="$(mktemp)"
            cp "${APP_DIR}/.env" "${TMP_ENV}"
            mkdir -p "${APP_DIR}/uploads" "${APP_DIR}/media" "${APP_DIR}/staticfiles"
            tar -xzf "${RELEASE_ARCHIVE}" -C "${APP_DIR}"
            cp "${TMP_ENV}" "${APP_DIR}/.env"
            rm -f "${TMP_ENV}"
            chmod +x "${APP_DIR}/entrypoint.sh" "${APP_DIR}/scripts/deploy.sh"

            export SKIP_EXTRACT=1
            bash "${APP_DIR}/scripts/deploy.sh"
